name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: fuzz smoke
        run: |
          go test ./pkg/codec/codectest -run '^$' -fuzz '^FuzzRoundTrip$' -fuzztime 30s
          go test ./pkg/canonical -run '^$' -fuzz '^FuzzIdempotent$' -fuzztime 30s
          go test ./pkg/tokens -run '^$' -fuzz '^FuzzO200k$' -fuzztime 30s
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trimproof:ci .
      - name: healthz
        run: |
          docker run -d --name tp -p 8080:8080 trimproof:ci -require-identity=false
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs tp; exit 1
      - name: report CLI
        run: docker run --rm --entrypoint /usr/local/bin/trimproof trimproof:ci report -policies /etc/trimproof/policies.json
